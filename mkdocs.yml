site_name: Desenvolvimento de Software
site_description: >
  Livro aberto sobre desenvolvimento de software: processos, requisitos,
  arquitetura, qualidade, testes, CI/CD e evolução.
site_author: "Sergio Souza Costa"
# Necessário para a página 404 encontrar o CSS e o JavaScript no GitHub Pages.
site_url: https://lambdageo-edu.github.io/book-engenharia-de-software/
copyright: >
  © Sergio Souza Costa ·
  Texto: <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br">CC BY-NC-SA 4.0</a> ·
  Código: <a href="https://github.com/lambdageo-edu/book-engenharia-de-software/blob/main/LICENSE-CODIGO">MIT</a>

docs_dir: docs
site_dir: site

theme:
  name: material
  variant: classic # mantém o visual anterior no Zensical
  language: pt
  custom_dir: overrides
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro

plugins:
  - search
  # Endereços da organização antiga, que ainda podem estar em links salvos.
  - redirects:
      redirect_maps:
        unidade1/00_plano_unidade1.md: index.md
        unidade1/01_introducao_engenharia_software.md: capitulos/01_introducao_engenharia_software.md
        unidade1/02_processos_desenvolvimento.md: capitulos/02_processos_desenvolvimento.md
        unidade1/03_especificacao_requisitos.md: capitulos/03_especificacao_requisitos.md
        unidade1/04_projeto_arquitetura.md: capitulos/04_projeto_arquitetura.md
        unidade1/05_implementacao_qualidade.md: capitulos/05_implementacao_qualidade.md
        unidade1/06_testes_validacao.md: capitulos/06_testes_validacao.md
        unidade1/07_integracao_entrega_continua.md: capitulos/07_integracao_entrega_continua.md
        unidade1/08_evolucao_manutencao.md: capitulos/08_evolucao_manutencao.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

nav:
  - "⇦ Coleção LambdaGeo": https://lambdageo.github.io/ebooks/
  - Apresentação: index.md

  - "Parte I: Fundamentos":
    - "Cap 1: Introdução à Engenharia de Software":       capitulos/01_introducao_engenharia_software.md
    - "Cap 2: Processos: do Cascata ao Ágil e DevOps":    capitulos/02_processos_desenvolvimento.md
  - "Parte II: Requisitos e projeto":
    - "Cap 3: Especificação de Requisitos":               capitulos/03_especificacao_requisitos.md
    - "Cap 4: Projeto e Arquitetura de Software":         capitulos/04_projeto_arquitetura.md
  - "Parte III: Construção":
    - "Cap 5: Implementação e Qualidade de Código":       capitulos/05_implementacao_qualidade.md
    - "Cap 6: Testes e Validação":                        capitulos/06_testes_validacao.md
  - "Parte IV: Entrega e evolução":
    - "Cap 7: Integração e Entrega Contínua (CI/CD)":     capitulos/07_integracao_entrega_continua.md
    - "Cap 8: Evolução, Manutenção e Débito Técnico":     capitulos/08_evolucao_manutencao.md

  - Apêndices:
    - "HTTP e APIs em poucas linhas": apendices/http_api.md
    - "Git e contêineres na prática": apendices/git_conteineres.md
