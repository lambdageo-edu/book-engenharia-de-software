name: Publicar Livro (GitHub Pages via gh-pages)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para criar e atualizar a branch gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Histórico completo, inclusive da gh-pages

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build do Livro
        # Em PRs e na main: o modo estrito interrompe o build se houver avisos
        run: zensical build --strict --clean

      - name: Deploy para a branch gh-pages
        # Faz o deploy apenas a partir da main, nunca em pull requests
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force --message "Publica o livro (${GITHUB_SHA})" site
