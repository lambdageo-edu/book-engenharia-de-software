name: Verificar links

on:
  schedule:
    - cron: "17 9 * * 1" # segundas-feiras, 06h17 em Fortaleza
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar os links dos arquivos Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Endereços de exemplo e locais ficam de fora.
          # 429 (muitos pedidos) não indica link quebrado.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200..=299,429
            --exclude "SEU_USUARIO"
            --exclude "exemplo\."
            --exclude "example\."
            --exclude-loopback
            "docs/**/*.md"
          fail: true
